<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AeroLife | C-MAPSS RUL Prediction{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite" aria-hidden="true">
    <symbol id="icon-plane" viewBox="0 0 24 24">
      <path d="M22 2 11 13"></path>
      <path d="M22 2 15 22l-4-9-9-4Z"></path>
    </symbol>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </symbol>
    <symbol id="icon-activity" viewBox="0 0 24 24">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="17 8 12 3 7 8"></polyline>
      <line x1="12" y1="3" x2="12" y2="15"></line>
    </symbol>
    <symbol id="icon-bar" viewBox="0 0 24 24">
      <line x1="18" y1="20" x2="18" y2="10"></line>
      <line x1="12" y1="20" x2="12" y2="4"></line>
      <line x1="6" y1="20" x2="6" y2="14"></line>
    </symbol>
    <symbol id="icon-info" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="16" x2="12" y2="12"></line>
      <line x1="12" y1="8" x2="12.01" y2="8"></line>
    </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
      <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
      <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
    </symbol>
    <symbol id="icon-cpu" viewBox="0 0 24 24">
      <rect x="4" y="4" width="16" height="16" rx="2"></rect>
      <rect x="9" y="9" width="6" height="6"></rect>
      <line x1="9" y1="1" x2="9" y2="4"></line>
      <line x1="15" y1="1" x2="15" y2="4"></line>
      <line x1="9" y1="20" x2="9" y2="23"></line>
      <line x1="15" y1="20" x2="15" y2="23"></line>
      <line x1="20" y1="9" x2="23" y2="9"></line>
      <line x1="20" y1="14" x2="23" y2="14"></line>
      <line x1="1" y1="9" x2="4" y2="9"></line>
      <line x1="1" y1="14" x2="4" y2="14"></line>
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      <polyline points="9 12 11 14 15 10"></polyline>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <polyline points="20 6 9 17 4 12"></polyline>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24">
      <polyline points="6 9 12 15 18 9"></polyline>
    </symbol>
    <symbol id="icon-send" viewBox="0 0 24 24">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </symbol>
    <symbol id="icon-file" viewBox="0 0 24 24">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="16" y1="13" x2="8" y2="13"></line>
      <line x1="16" y1="17" x2="8" y2="17"></line>
    </symbol>
    <symbol id="icon-gauge" viewBox="0 0 24 24">
      <path d="M12 3a9 9 0 0 0-9 9"></path>
      <path d="M21 12a9 9 0 0 0-9-9"></path>
      <path d="M3 12a9 9 0 0 0 18 0"></path>
      <line x1="12" y1="12" x2="16" y2="8"></line>
      <circle cx="12" cy="12" r="1.6"></circle>
    </symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12 6 12 12 16 14"></polyline>
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
      <polyline points="2 17 12 22 22 17"></polyline>
      <polyline points="2 12 12 17 22 12"></polyline>
    </symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/">
        <span class="brand-icon"><svg class="icon"><use href="#icon-plane"></use></svg></span>
        <span class="brand-text">
          <span class="brand-name">AeroLife</span>
          <span class="brand-sub">C-MAPSS RUL Prediction</span>
        </span>
      </a>

      <nav class="nav">
        <a class="nav-link {% if active_page == 'home' %}active{% endif %}" href="/">
          <svg class="icon"><use href="#icon-home"></use></svg><span>Home</span>
        </a>
        <a class="nav-link" href="/#input-engine">
          <svg class="icon"><use href="#icon-activity"></use></svg><span>Predict RUL</span>
        </a>
        <a class="nav-link" href="/?tab=upload#input-engine">
          <svg class="icon"><use href="#icon-upload"></use></svg><span>Upload CSV</span>
        </a>
        <a class="nav-link {% if active_page == 'performance' %}active{% endif %}" href="/performance">
          <svg class="icon"><use href="#icon-bar"></use></svg><span>Model Performance</span>
        </a>
        <a class="nav-link {% if active_page == 'about' %}active{% endif %}" href="/about">
          <svg class="icon"><use href="#icon-info"></use></svg><span>About Project</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="sidebar-turbine"></div>
        <p>NASA C-MAPSS</p>
        <span>FD001 – FD004 · 21 sensors</span>
      </div>
    </aside>

    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
